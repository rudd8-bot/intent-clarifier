<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intent Clarifier</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0c0c12; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const ACCESS_CODE = "7348";

    async function callClaude(system, user) {
      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system,
          messages: [{ role: "user", content: user }]
        })
      });
      const data = await res.json();
      if (!data.content?.[0]?.text) throw new Error("API 오류");
      return data.content[0].text;
    }

    function safeJson(text) {
      try { return JSON.parse(text.replace(/```json|```/g, "").trim()); }
      catch { return null; }
    }

    // ── FIX 2: 축 라벨 정확하게 재정의 ──────────────────────────
    const ROUND_PROMPT = (num, hadNotThis) => `사용자의 불편함/문제 의도를 파악하는 라운드 ${num}이다.

${num === 1 ? `
축 구성:
- 목적: 찾기 / 이해 / 결정 / 전달 / 만들기 / 확인 (무엇을 하고 싶나)
- 속도: 빠르게 / 확실하게 / 완전히 (얼마나 급하고 철저하게)
- 대상: 나 혼자 / 팀에게 / 고객에게 (누구를 위한 것인가)
` : num === 2 ? `
축 구성:
- 형식: 문서 / 코드 / 대화 / 비교표 / 요약 / 실행계획 (어떤 형태로)
- 깊이: 개요만 / 핵심만 / 깊게 / 바로실행 (얼마나 파고드나)
- 공유: 혼자쓸것 / 팀공유 / 외부공유 (누가 볼 것인가)
` : `
축 구성:
- 타이밍: 지금바로 / 내일 / 나중에 (언제 실행할 것인가)
- 완성도: 초안이라도 / 완성된것 / 반복개선 (어느 수준의 결과물)
- 크기: 한가지만 / 작게시작 / 한번에크게 (규모)
`}

${hadNotThis ? `
⚠️ 이전 라운드에서 "이게 아닌데"가 선택됐다.
이전에 제시한 축과 방향이 달랐다는 뜻이다.
이번엔 이전과 완전히 다른 각도에서 선택지를 구성해라.
이전에 쓴 단어와 표현을 재사용하지 말 것.
` : ""}

규칙:
- 각 축마다 2~3개, 총 8~10개 선택지
- 선택지 7자 이내, 축 이름 3자 이내로 짧게
- 사용자 맥락 반영
- JSON만 출력

출력: {"groups": [{"axis": "축이름", "options": ["선택지1", "선택지2"]}, ...]}`;

    const REFINEMENT_PROMPT = `특정 축에서 "이게 아닌데"가 반복됐다. 그 축 안을 더 세밀하게 쪼개야 한다.
규칙: 해당 축의 하위 개념 5개로 세분화, 6자 이내, JSON만 출력
출력: {"axis": "축이름", "options": ["세부1","세부2","세부3","세부4","세부5"]}`;

    const STUCK_Q_PROMPT = `사용자 의도가 3라운드 후에도 잡히지 않았다.
의도를 좁힐 직접 질문 1개를 만들어라. 20자 이내, "지금 가장 ___?" 형식.
JSON만 출력: {"question": "질문"}`;

    const STUCK_ROUND_PROMPT = `사용자가 직접 질문에 답했다. 그 답변으로 좁은 선택지 5개를 만들어라.
7자 이내, JSON만 출력: {"options": ["선택지1","선택지2","선택지3","선택지4","선택지5"]}`;

    // ── FIX 1: 첫 문장 화자 강제 ─────────────────────────────────
    const RESULT_PROMPT = `지금까지의 선택 데이터로 의도를 분석해라.

신뢰도:
1(뚜렷해): 이게아닌데 없음 + 같은 축 수렴
2(대략): 이게아닌데 1회 or 약간 분산
3(방향은맞는데): 이게아닌데 2회+ or 축 분산
4(못잡음): 패턴 없음

참고: 주관식 직접입력 항목은 사용자가 선택지에 없어서 직접 쓴 것이므로 의도 파악에 높은 가중치를 줘.

firstSentence 작성 규칙 (반드시 지킬 것):
- 사용자가 AI에게 요청하는 문장이어야 한다
- 반드시 "~해줘", "~알려줘", "~만들어줘", "~정리해줘" 형태로 끝내야 한다
- AI가 사용자에게 말하는 조언/안내 형태 절대 금지
- 사용자가 그대로 복사해서 AI에 붙여넣을 수 있어야 한다
- 예시: "회의를 줄이기 위한 팀 적용 가능한 최소 규칙 3가지를 만들어줘"

출력:
{"confidence": 1~4, "summary": "2문장 요약", "firstSentence": "요청형 문장"}
JSON만 출력.`;

    const CONF = {
      1: { label: "뚜렷하게 잡혔어", color: "#6ee7b7", hint: "첫 문장 바로 복사해서 써봐" },
      2: { label: "대략 잡혔어", color: "#fbbf24", hint: "첫 문장 자연스러우면 맞는 거야" },
      3: { label: "방향은 맞는데 흐려", color: "#f97316", hint: "첫 문장 고쳐가면서 좁혀봐" },
      4: { label: "아직 못 잡았어", color: "#f87171", hint: "'가장 피하고 싶은 것' 하나만 써서 다시 시작해봐" }
    };

    function App() {
      const [stage, setStage] = useState("access");
      const [codeInput, setCodeInput] = useState("");
      const [codeError, setCodeError] = useState(false);
      const [userInput, setUserInput] = useState("");
      const [roundNum, setRoundNum] = useState(1);
      const [groups, setGroups] = useState([]);
      const [selected, setSelected] = useState([]);
      const [customInput, setCustomInput] = useState("");
      const [customSelections, setCustomSelections] = useState([]);
      const [notThis, setNotThis] = useState(false);
      const [history, setHistory] = useState([]);
      const [axisNotThisMap, setAxisNotThisMap] = useState({});
      const [hadNotThisLastRound, setHadNotThisLastRound] = useState(false); // FIX 3
      const [refinementAxis, setRefinementAxis] = useState(null);
      const [stuckCount, setStuckCount] = useState(0);
      const [stuckQuestion, setStuckQuestion] = useState("");
      const [stuckAnswer, setStuckAnswer] = useState("");
      const [result, setResult] = useState(null);
      const [editedSentence, setEditedSentence] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const addCustom = () => {
        const val = customInput.trim();
        if (!val || customSelections.includes(val)) return;
        setCustomSelections(prev => [...prev, val]);
        setCustomInput("");
      };
      const removeCustom = (val) => setCustomSelections(prev => prev.filter(v => v !== val));
      const allSelected = [...selected, ...customSelections.map(v => `[직접입력] ${v}`)];

      const buildHistText = (hist) =>
        hist.map(h => `${h.label}: 선택=[${h.selected.join(",")}] 이게아닌데=${h.notThis}`).join("\n");

      const getSelectedAxes = () => {
        const map = {};
        groups.forEach(g => {
          if (g.options.some(o => selected.includes(o))) map[g.axis] = true;
        });
        return Object.keys(map);
      };

      const resetRound = () => {
        setSelected([]); setNotThis(false);
        setCustomInput(""); setCustomSelections([]);
      };

      const goResult = async (hist) => {
        const text = await callClaude(RESULT_PROMPT,
          `원본 입력: "${userInput}"\n이력:\n${buildHistText(hist)}`);
        const parsed = safeJson(text);
        if (!parsed?.confidence) throw new Error("파싱 실패");
        setResult(parsed);
        setEditedSentence(parsed.firstSentence);
        setStage("result");
      };

      const goStuck = async (hist) => {
        const next = stuckCount + 1;
        setStuckCount(next);
        if (next >= 2) { setStage("giveup"); return; }
        const text = await callClaude(STUCK_Q_PROMPT,
          `원본 입력: "${userInput}"\n이력:\n${buildHistText(hist)}`);
        const parsed = safeJson(text);
        if (!parsed?.question) throw new Error();
        setStuckQuestion(parsed.question);
        setStuckAnswer("");
        setStage("stuck");
      };

      const startRound1 = async () => {
        if (!userInput.trim()) return;
        setLoading(true); setError("");
        try {
          const text = await callClaude(ROUND_PROMPT(1, false), `사용자 입력: "${userInput}"`);
          const parsed = safeJson(text);
          if (!parsed?.groups) throw new Error();
          setGroups(parsed.groups);
          resetRound();
          setRoundNum(1); setStage("round");
        } catch { setError("선택지 생성 실패. 다시 시도해줘."); }
        setLoading(false);
      };

      const handleNext = async () => {
        setLoading(true); setError("");
        const roundData = {
          label: stage === "refinement" ? `세밀화(${refinementAxis})` :
                 stage === "stuckRound" ? "막힘라운드" : `R${roundNum}`,
          selected: allSelected, notThis
        };
        const newHist = [...history, roundData];
        setHistory(newHist);

        // FIX 3: 이게아닌데 1회도 즉각 반응
        let newAxisMap = { ...axisNotThisMap };
        if (notThis) {
          getSelectedAxes().forEach(ax => {
            newAxisMap[ax] = (newAxisMap[ax] || 0) + 1;
          });
          setAxisNotThisMap(newAxisMap);
          setHadNotThisLastRound(true);
        } else {
          setHadNotThisLastRound(false);
        }

        // 세밀화 기준: 1회로 낮춤 (기존 2회 → 1회)
        const needRefineAxis = Object.entries(newAxisMap).find(([, c]) => c >= 1)?.[0];

        try {
          if (needRefineAxis && stage !== "refinement") {
            const text = await callClaude(REFINEMENT_PROMPT,
              `세밀화 축: "${needRefineAxis}"\n원본: "${userInput}"\n이력:\n${buildHistText(newHist)}`);
            const parsed = safeJson(text);
            if (!parsed?.options) throw new Error();
            setGroups([{ axis: parsed.axis || needRefineAxis, options: parsed.options }]);
            setRefinementAxis(needRefineAxis);
            resetRound();
            setStage("refinement");
          } else if (stage === "refinement" && notThis) {
            await goStuck(newHist);
          } else if (stage === "stuckRound" || stage === "refinement" || roundNum >= 3) {
            await goResult(newHist);
          } else {
            const next = roundNum + 1;
            // FIX 3: 이게아닌데 있었으면 다른 축 방향으로 프롬프트 전달
            const text = await callClaude(
              ROUND_PROMPT(next, notThis),
              `원본: "${userInput}"\n이력:\n${buildHistText(newHist)}`
            );
            const parsed = safeJson(text);
            if (!parsed?.groups) throw new Error();
            setGroups(parsed.groups);
            resetRound();
            setRoundNum(next);
            setStage("round");
          }
        } catch { setError("처리 중 오류. 다시 시도해줘."); }
        setLoading(false);
      };

      const handleDone = async () => {
        setLoading(true); setError("");
        const roundData = { label: `R${roundNum}(조기)`, selected: allSelected, notThis };
        const newHist = [...history, roundData];
        setHistory(newHist);
        try { await goResult(newHist); }
        catch { setError("결과 생성 실패."); }
        setLoading(false);
      };

      const handleStuckAnswer = async () => {
        if (!stuckAnswer.trim()) return;
        setLoading(true); setError("");
        try {
          const text = await callClaude(STUCK_ROUND_PROMPT,
            `원본: "${userInput}"\n질문: "${stuckQuestion}"\n답변: "${stuckAnswer}"`);
          const parsed = safeJson(text);
          if (!parsed?.options) throw new Error();
          setGroups([{ axis: "좁힌 선택지", options: parsed.options }]);
          resetRound();
          setStage("stuckRound");
        } catch { setError("처리 중 오류."); }
        setLoading(false);
      };

      const toggle = (opt) =>
        setSelected(prev => prev.includes(opt) ? prev.filter(o => o !== opt) : [...prev, opt]);

      const restart = () => {
        setStage("input"); setUserInput(""); setGroups([]);
        setSelected([]); setCustomInput(""); setCustomSelections([]);
        setNotThis(false); setHistory([]); setAxisNotThisMap({});
        setHadNotThisLastRound(false); setRefinementAxis(null);
        setStuckCount(0); setStuckQuestion(""); setStuckAnswer("");
        setResult(null); setEditedSentence(""); setError(""); setRoundNum(1);
      };

      const isRoundStage = ["round", "refinement", "stuckRound"].includes(stage);
      const conf = result ? CONF[result.confidence] : null;
      const stageLabel =
        stage === "refinement" ? `세밀화 · ${refinementAxis}` :
        stage === "stuckRound" ? "마지막 시도" : `라운드 ${roundNum} / 3`;
      const nextBtnLabel = loading ? "분석 중..." :
        (stage === "refinement" || stage === "stuckRound" || roundNum >= 3) ? "결과 보기 →" : "다음 →";
      const totalSelected = selected.length + customSelections.length;

      return (
        <div style={{ minHeight: "100vh", background: "#0c0c12", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "32px 16px" }}>
          <div style={{ width: "100%", maxWidth: 500 }}>

            <div style={{ marginBottom: 28 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <div style={{ width: 7, height: 7, borderRadius: "50%", background: "#6ee7b7", boxShadow: "0 0 10px #6ee7b7" }} />
                <span style={{ fontSize: 10, color: "#6ee7b7", letterSpacing: 3, textTransform: "uppercase" }}>Intent Clarifier</span>
              </div>
              <h1 style={{ fontSize: 20, fontWeight: 700, color: "#eeeef5", margin: 0 }}>뭘 원하는지 모를 때</h1>
              <p style={{ fontSize: 12, color: "#3a3a50", marginTop: 4 }}>선택으로 의도를 좁혀가는 도구</p>
            </div>

            {stage === "access" && (
              <div>
                <p style={{ fontSize: 13, color: "#555", marginBottom: 16 }}>접근 코드를 입력해줘.</p>
                <input
                  type="password"
                  value={codeInput}
                  onChange={e => { setCodeInput(e.target.value); setCodeError(false); }}
                  onKeyDown={e => {
                    if (e.key === "Enter") {
                      if (codeInput === ACCESS_CODE) { setStage("input"); }
                      else { setCodeError(true); setCodeInput(""); }
                    }
                  }}
                  placeholder="코드 입력 후 Enter"
                  autoFocus
                  style={{ width: "100%", padding: "13px 15px", background: "#181824", border: `1.5px solid ${codeError ? "#f87171" : "#252535"}`, borderRadius: 10, color: "#eeeef5", fontSize: 18, letterSpacing: 6, outline: "none", boxSizing: "border-box", textAlign: "center" }}
                />
                {codeError && <p style={{ color: "#f87171", fontSize: 12, marginTop: 8, textAlign: "center" }}>코드가 틀렸어.</p>}
                <button
                  onClick={() => {
                    if (codeInput === ACCESS_CODE) { setStage("input"); }
                    else { setCodeError(true); setCodeInput(""); }
                  }}
                  disabled={!codeInput}
                  style={{ marginTop: 12, width: "100%", padding: "13px 0", background: codeInput ? "#6ee7b7" : "#181824", color: codeInput ? "#0c0c12" : "#333", border: "none", borderRadius: 9, fontSize: 14, fontWeight: 700, cursor: codeInput ? "pointer" : "not-allowed" }}>
                  확인 →
                </button>
              </div>
            )}

            {stage === "input" && (
              <div>
                <p style={{ fontSize: 13, color: "#555", marginBottom: 10 }}>지금 상황을 편하게 써봐. 장황해도 괜찮아.</p>
                <textarea value={userInput} onChange={e => setUserInput(e.target.value)}
                  placeholder="예) 요즘 업무가 너무 많아서 뭐부터 해야할지 모르겠고..." rows={5}
                  style={{ width: "100%", padding: "13px 15px", background: "#181824", border: "1.5px solid #252535", borderRadius: 10, color: "#eeeef5", fontSize: 14, resize: "vertical", outline: "none", boxSizing: "border-box", lineHeight: 1.65 }} />
                {error && <p style={{ color: "#f87171", fontSize: 12, marginTop: 8 }}>{error}</p>}
                <button onClick={startRound1} disabled={loading || !userInput.trim()}
                  style={{ marginTop: 12, width: "100%", padding: "13px 0", background: loading || !userInput.trim() ? "#181824" : "#6ee7b7", color: loading || !userInput.trim() ? "#333" : "#0c0c12", border: "none", borderRadius: 9, fontSize: 14, fontWeight: 700, cursor: loading || !userInput.trim() ? "not-allowed" : "pointer" }}>
                  {loading ? "분석 중..." : "의도 찾기 시작 →"}
                </button>
              </div>
            )}

            {isRoundStage && (
              <div>
                <div style={{ display: "flex", gap: 5, marginBottom: 18 }}>
                  {[1,2,3].map(r => (
                    <div key={r} style={{ flex: 1, height: 2, borderRadius: 2, background: r <= roundNum ? "#6ee7b7" : "#1e1e30", opacity: r < roundNum ? 0.35 : 1 }} />
                  ))}
                </div>
                <div style={{ marginBottom: 18 }}>
                  <span style={{ fontSize: 10, color: "#3a3a55", letterSpacing: 2, textTransform: "uppercase" }}>{stageLabel}</span>
                  <p style={{ fontSize: 14, color: "#7070a0", marginTop: 5, marginBottom: 0 }}>
                    {stage === "refinement" ? `"${refinementAxis}" 안에서 더 정확한 걸 골라봐.` :
                     stage === "stuckRound" ? "이 중에 제일 가까운 걸 골라봐." :
                     roundNum === 1 ? "맞는 방향을 골라봐. 여러 개도 괜찮아." :
                     roundNum === 2 ? "조금 더 좁혀볼게." : "마지막이야. 제일 가까운 걸."}
                  </p>
                </div>

                {groups.map((g, gi) => (
                  <div key={gi} style={{ marginBottom: 16 }}>
                    <div style={{ fontSize: 10, color: "#3a3a55", letterSpacing: 2, textTransform: "uppercase", marginBottom: 7, paddingLeft: 4, borderLeft: "2px solid #252535" }}>{g.axis}</div>
                    {g.options.map((opt, oi) => {
                      const isSel = selected.includes(opt);
                      return (
                        <label key={oi} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 13px", background: isSel ? "#0a2218" : "#14141e", border: `1.5px solid ${isSel ? "#6ee7b7" : "#1e1e30"}`, borderRadius: 7, cursor: "pointer", fontSize: 14, color: isSel ? "#6ee7b7" : "#9090b0", marginBottom: 5 }}>
                          <input type="checkbox" checked={isSel} onChange={() => toggle(opt)}
                            style={{ width: 14, height: 14, accentColor: "#6ee7b7", flexShrink: 0 }} />
                          {opt}
                        </label>
                      );
                    })}
                  </div>
                ))}

                {/* 직접 입력 */}
                <div style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 10, color: "#3a3a55", letterSpacing: 2, textTransform: "uppercase", marginBottom: 7, paddingLeft: 4, borderLeft: "2px solid #2a2040" }}>직접 입력</div>
                  {customSelections.length > 0 && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                      {customSelections.map((val, i) => (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 10px", background: "#1a0a2e", border: "1.5px solid #7c3aed", borderRadius: 20, fontSize: 13, color: "#a78bfa" }}>
                          {val}
                          <span onClick={() => removeCustom(val)} style={{ cursor: "pointer", color: "#6040a0", fontSize: 14, lineHeight: 1 }}>×</span>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 6 }}>
                    <input type="text" value={customInput} onChange={e => setCustomInput(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && addCustom()}
                      placeholder="선택지에 없으면 직접 써봐"
                      style={{ flex: 1, padding: "10px 13px", background: "#14141e", border: "1.5px solid #2a2040", borderRadius: 7, color: "#c0b0f0", fontSize: 13, outline: "none" }} />
                    <button onClick={addCustom} disabled={!customInput.trim()}
                      style={{ padding: "10px 14px", background: customInput.trim() ? "#7c3aed" : "#1a1a2e", color: customInput.trim() ? "#fff" : "#333", border: "none", borderRadius: 7, fontSize: 13, fontWeight: 600, cursor: customInput.trim() ? "pointer" : "not-allowed" }}>
                      추가
                    </button>
                  </div>
                </div>

                {/* 이게 아닌데 */}
                <label style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 13px", marginBottom: 16, background: notThis ? "#1a1000" : "#0e0e18", border: `1.5px solid ${notThis ? "#fbbf24" : "#181828"}`, borderRadius: 7, cursor: "pointer", fontSize: 13, color: notThis ? "#fbbf24" : "#3a3a55" }}>
                  <input type="checkbox" checked={notThis} onChange={() => setNotThis(!notThis)}
                    style={{ width: 13, height: 13, accentColor: "#fbbf24", flexShrink: 0 }} />
                  이게 아닌데 — 방향이 좀 달라
                </label>

                {error && <p style={{ color: "#f87171", fontSize: 12, marginBottom: 10 }}>{error}</p>}

                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={handleDone} disabled={loading}
                    style={{ flex: 1, padding: "12px 0", background: "transparent", color: "#3a3a55", border: "1.5px solid #1e1e30", borderRadius: 8, fontSize: 12, cursor: loading ? "not-allowed" : "pointer" }}>
                    충분해, 결과 볼게
                  </button>
                  <button onClick={handleNext} disabled={loading}
                    style={{ flex: 2, padding: "12px 0", background: loading ? "#181824" : "#6ee7b7", color: loading ? "#333" : "#0c0c12", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer" }}>
                    {nextBtnLabel}
                  </button>
                </div>
                <p style={{ textAlign: "center", fontSize: 11, color: "#252535", marginTop: 8 }}>
                  {totalSelected}개 선택됨{customSelections.length > 0 ? ` (직접입력 ${customSelections.length}개 포함)` : ""}
                </p>
              </div>
            )}

            {stage === "stuck" && (
              <div>
                <div style={{ background: "#14141e", border: "1px solid #252535", borderRadius: 10, padding: "16px 18px", marginBottom: 16 }}>
                  <p style={{ fontSize: 10, color: "#3a3a55", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 8px 0" }}>직접 질문</p>
                  <p style={{ fontSize: 16, color: "#eeeef5", margin: 0, fontWeight: 600 }}>{stuckQuestion}</p>
                </div>
                <textarea value={stuckAnswer} onChange={e => setStuckAnswer(e.target.value)}
                  placeholder="짧게 써봐." rows={3}
                  style={{ width: "100%", padding: "12px 14px", background: "#14141e", border: "1.5px solid #252535", borderRadius: 9, color: "#eeeef5", fontSize: 14, resize: "none", outline: "none", boxSizing: "border-box" }} />
                {error && <p style={{ color: "#f87171", fontSize: 12, marginTop: 8 }}>{error}</p>}
                <button onClick={handleStuckAnswer} disabled={loading || !stuckAnswer.trim()}
                  style={{ marginTop: 10, width: "100%", padding: "13px 0", background: loading || !stuckAnswer.trim() ? "#181824" : "#6ee7b7", color: loading || !stuckAnswer.trim() ? "#333" : "#0c0c12", border: "none", borderRadius: 9, fontSize: 14, fontWeight: 700, cursor: loading || !stuckAnswer.trim() ? "not-allowed" : "pointer" }}>
                  {loading ? "분석 중..." : "이걸로 다시 →"}
                </button>
              </div>
            )}

            {stage === "result" && result && conf && (
              <div>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "6px 13px", borderRadius: 20, background: `${conf.color}15`, border: `1px solid ${conf.color}40`, marginBottom: 18 }}>
                  <div style={{ width: 6, height: 6, borderRadius: "50%", background: conf.color, boxShadow: `0 0 6px ${conf.color}` }} />
                  <span style={{ fontSize: 13, color: conf.color, fontWeight: 600 }}>{conf.label}</span>
                </div>
                <div style={{ background: "#14141e", border: "1px solid #252535", borderRadius: 10, padding: "14px 16px", marginBottom: 14 }}>
                  <p style={{ fontSize: 10, color: "#3a3a55", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 8px 0" }}>의도 요약</p>
                  <p style={{ fontSize: 14, color: "#b0b0cc", lineHeight: 1.75, margin: 0 }}>{result.summary}</p>
                </div>
                <div style={{ marginBottom: 14 }}>
                  <p style={{ fontSize: 10, color: "#3a3a55", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 8px 0" }}>
                    AI한테 이렇게 던져봐 <span style={{ color: "#252540", letterSpacing: 0, textTransform: "none", fontSize: 11 }}>— 고쳐도 돼</span>
                  </p>
                  <textarea value={editedSentence} onChange={e => setEditedSentence(e.target.value)} rows={3}
                    style={{ width: "100%", padding: "12px 14px", background: "#0a2218", border: `1.5px solid ${conf.color}40`, borderRadius: 9, color: "#6ee7b7", fontSize: 14, resize: "none", outline: "none", boxSizing: "border-box", lineHeight: 1.65 }} />
                  <p style={{ fontSize: 12, color: "#3a3a55", marginTop: 6 }}>{conf.hint}</p>
                </div>
                <div style={{ background: "#0e0e18", borderRadius: 9, padding: "12px 14px", marginBottom: 16 }}>
                  <p style={{ fontSize: 10, color: "#252540", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 8px 0" }}>선택 이력</p>
                  {history.map((h, i) => (
                    <div key={i} style={{ fontSize: 12, marginBottom: 5 }}>
                      <span style={{ color: "#3a3a55" }}>{h.label} </span>
                      <span style={{ color: "#6060a0" }}>{h.selected.length > 0 ? h.selected.join(" · ") : "없음"}</span>
                      {h.notThis && <span style={{ color: "#fbbf24" }}> · 이게아닌데</span>}
                    </div>
                  ))}
                </div>
                <button onClick={restart} style={{ width: "100%", padding: "12px 0", background: "transparent", color: "#6ee7b7", border: "1.5px solid #6ee7b7", borderRadius: 9, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                  다시 시작하기
                </button>
              </div>
            )}

            {stage === "giveup" && (
              <div style={{ textAlign: "center", padding: "32px 0" }}>
                <div style={{ fontSize: 36, marginBottom: 20 }}>🤔</div>
                <p style={{ color: "#5050a0", fontSize: 15, lineHeight: 1.9, marginBottom: 28 }}>
                  이 도구로는 잡기 어려운 것 같아.<br />
                  처음으로 돌아가서<br />
                  <span style={{ color: "#fbbf24" }}>"지금 가장 피하고 싶은 것"</span><br />
                  딱 하나만 써봐.
                </p>
                <button onClick={restart} style={{ padding: "12px 32px", background: "transparent", color: "#3a3a55", border: "1.5px solid #252535", borderRadius: 9, fontSize: 13, cursor: "pointer" }}>
                  다시 시작하기
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
